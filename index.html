<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07090d"><title>Supi — Live AI</title>
<link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script>
</head>
<body><main class="shell">
<header class="header"><a class="logo" href="/" aria-label="Supi">S<span>U</span>PI<span class="spark">✦</span></a><button class="icon" id="settings" aria-label="Settings">⚙</button></header>
<section class="stage"><div class="eyebrow"><i></i><span id="state">READY WHEN YOU ARE</span></div><div class="orb-wrap" id="orb"><div class="halo"></div><div class="orb"><div class="shine"></div><div class="core"></div></div></div><h1 id="greeting">Hello, I’m <span>Supi</span></h1><p class="sub" id="subtitle">আপনার নিজের AI voice assistant</p><div class="transcript" id="transcript" aria-live="polite"></div></section>
<footer class="controls"><button class="mic" id="mic" aria-label="Start voice conversation"><span class="mic-symbol">●</span></button><div class="mic-label" id="miclabel">TAP TO TALK</div><div class="text-entry"><input id="question" placeholder="Ask Supi anything…" aria-label="Write a question"><button id="send" aria-label="Send">↑</button></div><div class="footer-note">LIVE CONVERSATION · SUPI AI</div></footer>
</main><div class="modal" id="modal"><section class="dialog"><button class="close" id="close">×</button><div class="tiny">PERSONALISE YOUR CONNECTION</div><h2>Server settings</h2><label>Hosted server URL</label><input id="server" placeholder="https://supi.example.com"><label>Access token <small>(if your server requires one)</small></label><input id="token" type="password" placeholder="Optional server token"><p>Server URL is normally set automatically when you open Supi from its hosted address.</p><button class="save" id="save">Save settings</button></section></div>
</body></html>
